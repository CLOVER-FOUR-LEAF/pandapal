<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1d3a2e"/>
      <stop offset=".55" stop-color="#0f1c17"/>
      <stop offset="1" stop-color="#0a1310"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#34d399" stop-opacity=".32"/>
      <stop offset=".6" stop-color="#10b981" stop-opacity=".1"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fur" cx="42%" cy="34%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".72" stop-color="#f4f1ea"/>
      <stop offset="1" stop-color="#ddd6ca"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3632"/>
      <stop offset="1" stop-color="#1c1a18"/>
    </linearGradient>
  </defs>

  <!-- 满版底色：maskable / apple-touch-icon 由系统裁圆角，不自带 rx -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="262" r="236" fill="url(#halo)"/>

  <!-- 星点 -->
  <g fill="#f8fafc">
    <circle cx="96" cy="118" r="3" opacity=".7"/>
    <circle cx="424" cy="96" r="2.4" opacity=".55"/>
    <circle cx="448" cy="352" r="2.6" opacity=".5"/>
    <circle cx="70" cy="380" r="2" opacity=".45"/>
    <path d="M410 168l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#fbbf24" opacity=".85"/>
  </g>

  <!-- 熊猫头：与 panda.js 的管家形象同一套造型，等比放大 -->
  <g transform="translate(8 76) scale(2.1)">
    <circle cx="66" cy="44" r="23" fill="url(#ink)"/>
    <circle cx="68" cy="47" r="10" fill="#4b423d"/>
    <circle cx="170" cy="44" r="23" fill="url(#ink)"/>
    <circle cx="168" cy="47" r="10" fill="#4b423d"/>

    <ellipse cx="118" cy="92" rx="72" ry="62" fill="url(#fur)"/>

    <path d="M78 82c10-10 26-6 28 8 2 13-6 28-20 30-14 2-22-10-20-20 1-7 6-13 12-18z" fill="url(#ink)"/>
    <path d="M158 82c-10-10-26-6-28 8-2 13 6 28 20 30 14 2 22-10 20-20-1-7-6-13-12-18z" fill="url(#ink)"/>

    <circle cx="91" cy="96" r="8" fill="#fff"/>
    <circle cx="92" cy="97" r="5.2" fill="#14110f"/>
    <circle cx="94.4" cy="94.2" r="2" fill="#fff"/>
    <circle cx="145" cy="96" r="8" fill="#fff"/>
    <circle cx="146" cy="97" r="5.2" fill="#14110f"/>
    <circle cx="148.4" cy="94.2" r="2" fill="#fff"/>

    <ellipse cx="118" cy="124" rx="24" ry="17" fill="#fbf9f4"/>
    <ellipse cx="66" cy="120" rx="11" ry="7" fill="#ff9c8f" opacity=".42"/>
    <ellipse cx="170" cy="120" rx="11" ry="7" fill="#ff9c8f" opacity=".42"/>

    <path d="M110 114.5c0-3 3.6-4.5 8-4.5s8 1.5 8 4.5c0 3.4-4.4 6.6-8 6.6s-8-3.2-8-6.6z" fill="#1c1a18"/>
    <ellipse cx="115.5" cy="113" rx="2.4" ry="1.2" fill="#fff" opacity=".45"/>
    <path d="M108 126q5 6 10 0q5 6 10 0" stroke="#1c1a18" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 耳边一片竹叶 -->
    <path d="M178 30c12-14 28-18 40-14-8 12-24 18-40 14z" fill="#34d399"/>
    <path d="M180 29c12-6 24-10 34-11" stroke="#10b981" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
